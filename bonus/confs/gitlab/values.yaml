global:
  edition: ce
  ingress:
    class: nginx
    configureCertmanager: false
    tls:
      enabled: false
  hosts:
    domain: 127.0.0.1.nip.io
    https: false

certmanager:
  install: false

gitlab-runner:
  install: false

prometheus:
  install: false

registry:
  enabled: false

nginx-ingress:
  enabled: true
  controller:
    scope:
      enabled: false
    service:
      type: LoadBalancer

postgresql:
  metrics:
    enabled: false

redis:
  metrics:
    enabled: false
